upstream frappe-server {
    server erpnext-backend:8000 fail_timeout=0;
}

upstream socketio-server {
    server erpnext-socketio:9000 fail_timeout=0;
}

# Redirect HTTP to HTTPS (uncomment after SSL setup)
# server {
#     listen 80;
#     server_name nextgenfarmershub.com www.nextgenfarmershub.com;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name nextgenfarmershub.com www.nextgenfarmershub.com _;

    root /var/www/html;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Frappe-Site-Name nextgenfarmershub.com;

    # Static assets with caching
    location /assets {
        alias /var/www/html/assets;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /files {
        alias /var/www/html/assets;
        try_files $uri =404;
    }

    # SocketIO
    location /socket.io {
        proxy_pass http://socketio-server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API endpoints with rate limiting
    location /api {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://frappe-server;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Main application
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://frappe-server;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check endpoint
    location /api/method/ping {
        proxy_pass http://frappe-server;
        access_log off;
    }
}

