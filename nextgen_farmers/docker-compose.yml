version: "3.8"

services:
  # MariaDB Database
  mariadb:
    image: mariadb:10.6
    container_name: nextgen_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextgen_db}
      MYSQL_USER: ${MYSQL_USER:-nextgen_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d
    networks:
      - nextgen-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --skip-innodb-read-only-compressed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Queue
  redis-cache:
    image: redis:7-alpine
    container_name: nextgen_redis_cache
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    networks:
      - nextgen-network
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    container_name: nextgen_redis_queue
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ERPNext Backend
  erpnext-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_backend
    restart: unless-stopped
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
      - REDIS_SOCKETIO=redis://redis-queue:6379
      - SOCKETIO_PORT=9000
      - AUTO_MIGRATE=1
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
      - assets-data:/home/frappe/frappe-bench/sites/assets
    networks:
      - nextgen-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ERPNext Workers
  erpnext-worker-default:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_worker_default
    restart: unless-stopped
    command: bench worker --queue default
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - nextgen-network
    depends_on:
      - erpnext-backend

  erpnext-worker-short:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_worker_short
    restart: unless-stopped
    command: bench worker --queue short
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - nextgen-network
    depends_on:
      - erpnext-backend

  erpnext-worker-long:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_worker_long
    restart: unless-stopped
    command: bench worker --queue long
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - nextgen-network
    depends_on:
      - erpnext-backend

  # Scheduler
  erpnext-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_scheduler
    restart: unless-stopped
    command: bench schedule
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - nextgen-network
    depends_on:
      - erpnext-backend

  # SocketIO for real-time features
  erpnext-socketio:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-14}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-14}
    container_name: nextgen_socketio
    restart: unless-stopped
    command: node apps/frappe/socketio.js
    environment:
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
    networks:
      - nextgen-network
    depends_on:
      - redis-queue
    ports:
      - "9000:9000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nextgen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - assets-data:/var/www/html/assets:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - nextgen-network
    depends_on:
      - erpnext-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: nextgen_certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nextgen-network

  # Database Backup Service
  backup:
    image: fradelg/mysql-cron-backup
    container_name: nextgen_backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextgen_db}
      CRON_TIME: "0 2 * * *"  # Daily at 2 AM
      MAX_BACKUPS: 7
      INIT_BACKUP: 0
      GZIP_LEVEL: 9
    volumes:
      - backup-data:/backup
    networks:
      - nextgen-network
    depends_on:
      - mariadb

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nextgen_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - nextgen-network
    profiles:
      - monitoring

  # Optional: Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: nextgen_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - nextgen-network
    profiles:
      - monitoring

networks:
  nextgen-network:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
  redis-cache-data:
    driver: local
  redis-queue-data:
    driver: local
  sites-data:
    driver: local
  logs-data:
    driver: local
  assets-data:
    driver: local
  backup-data:
    driver: local
  certbot-data:
    driver: local
  certbot-www:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
